  }
  function animate(time){

  $('zoomIn').onclick=()=>setZoom(zoom*1.18);$('zoomOut').onclick=()=>setZoom(zoom/1.18);
  $('reset').onclick=()=>{panX=panY=0;setZoom(.78);};
  $('drift').onclick=()=>{drifting=!drifting;driftLabel();};
  function driftLabel(){$('drift').textContent=tr(drifting?'pauseDrift':'resumeDrift');$('drift').setAttribute('aria-pressed',String(drifting));}
  driftLabel();
  wall.addEventListener('keydown',e=>{

  viewer.addEventListener('keydown',e=>{if(e.code==='KeyP'){e.preventDefault();paused=!paused;startEffects();}});
  function cleanup(){
    frame.getAnimations().forEach(a=>a.cancel());
    token++;clearInterval(timer);timer=0;cancelAnimationFrame(dustRAF);dustRAF=0;busy=false;chosen=-1;current=null;
    $('dust').getContext('2d').clearRect(0,0,$('dust').width,$('dust').height);frame.style.visibility='visible';
    $('imageStatus').textContent='';photo.removeAttribute('src');fx.clearRect(0,0,effect.width,effect.height);dirty=true;

  }
  viewer.addEventListener('close',cleanup);$('close').onclick=()=>viewer.close();
  function status(key){$('imageStatus').dataset.key=key;$('imageStatus').textContent=key?tr(key):'';}
  async function openPhoto(i){
    hideLens();
    chosen=i;step=0;revealed=false;paused=reduced;version=0;mode=-1;points=[];
    frame.className='frosted';viewer.showModal();
    $('repair').focus();await showFrame();
  }
  async function showFrame(){
    const seq=++token;busy=true;$('repair').disabled=true;clearInterval(timer);status('loading');
    try{
      const rec=records[chosen],im=await load(rec.images[step]);if(seq!==token||!viewer.open)return;
      current=im;photo.src=im.src;updatePhotoLabels();
      status('');busy=false;$('repair').disabled=false;
      points=(rec.faces[step]||[]).flatMap(b=>[{x:b[0]+b[2]/2,y:b[1]+b[3]/2},{x:b[0],y:b[1]},{x:b[0]+b[2],y:b[1]+b[3]}]);

    }catch(error){if(seq===token){busy=false;status('error');$('repair').disabled=true;}}
  }
  function fitPhoto(){

    effect.width=Math.max(1,Math.round(current.naturalWidth*scale*dpr));effect.height=Math.max(1,Math.round(current.naturalHeight*scale*dpr));

  }
  const frameObserver=new ResizeObserver(()=>{if(viewer.open&&current&&!dustRAF)fitPhoto();});frameObserver.observe(document.querySelector('.image-space'));
  function nextEffect(){

    automaticColor=colors[version%colors.length];
    effect.dataset.version=String(version);effect.dataset.mode=names[mode];renderEffect();

        {transform:'translateX(0) skewX(0deg)',filter:'brightness(1)',opacity:1},
        {transform:`translateX(${direction*1.4}px) skewX(${direction*.45}deg)`,filter:'brightness(1.045)',opacity:.96,offset:.3},
        {transform:`translateX(${-direction*.7}px) skewX(${-direction*.2}deg)`,filter:'brightness(.985)',opacity:.985,offset:.55},
        {transform:'translateX(0) skewX(0deg)',filter:'brightness(1)',opacity:1}

    }
  }
  function startEffects(){
    clearInterval(timer);timer=0;
    if(revealed&&!paused&&!busy&&!document.hidden)timer=setInterval(nextEffect,1000);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer);timer=0;}else if(viewer.open)startEffects();});
  function renderEffect(){

    const w=effect.width,h=effect.height,random=rand(effectSeed),color=automaticColor;
    const short=Math.min(w,h),scale=short/700;fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,w,h);
    fx.strokeStyle=color;fx.fillStyle=color;fx.lineWidth=Math.max(.8,1.1*scale);fx.globalAlpha=.83;

  // A bounded, photo-coloured particle field; no DOM fragments or per-frame pixel reads.
  function dissolve(){

  }
  async function init(){
    resize();requestAnimationFrame(animate);
    await Promise.all(records.map(async(rec,i)=>{
